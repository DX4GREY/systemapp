name: Build SystemApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_magisk:
        description: 'Build Magisk module'
        required: false
        default: "true"
      build_termux:
        description: 'Build Termux package'
        required: false
        default: "true"

# Needed for softprops/action-gh-release to push tags/releases with the
# default GITHUB_TOKEN on repos where Actions defaults to read-only.
permissions:
  contents: write

env:
  NDK_VERSION: r27b

jobs:
  build-architectures:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake ninja-build

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -d /usr/local/

      - name: Build binary for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: /usr/local/android-ndk-${{ env.NDK_VERSION }}
          ABI: ${{ matrix.abi }}
          API: 29
        run: |
          chmod +x scripts/build-binary.sh
          scripts/build-binary.sh

      # Output filename already carries the ABI (release/systemapp-<abi>),
      # so downstream jobs can tell architectures apart without relying on
      # the artifact name alone.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemapp-${{ matrix.abi }}
          path: release/systemapp-${{ matrix.abi }}
          compression-level: 9
          retention-days: 30
          if-no-files-found: error

  build-magisk:
    name: Build Magisk Module (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: build-architectures
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_magisk != 'false' }}

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download binary for ${{ matrix.abi }}
        uses: actions/download-artifact@v4
        with:
          name: systemapp-${{ matrix.abi }}
          path: release/

      - name: Build Magisk module for ${{ matrix.abi }}
        env:
          ABI: ${{ matrix.abi }}
        run: |
          chmod +x scripts/build-magisk.sh
          scripts/build-magisk.sh

      - name: Upload Magisk module artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemApp-Magisk-${{ matrix.abi }}
          path: release/SystemApp-Magisk-${{ matrix.abi }}.zip
          compression-level: 9
          retention-days: 90
          if-no-files-found: error

  build-termux:
    name: Build Termux Package
    runs-on: ubuntu-latest
    needs: build-architectures
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_termux != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Termux only targets arm64 devices in practice, so only the
      # arm64-v8a binary is needed here. Packaging reuses that binary
      # directly rather than recompiling on the (x86_64) runner - a
      # from-source rebuild here would silently produce a host-architecture
      # binary mislabeled as aarch64 in the .deb control file.
      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: systemapp-arm64-v8a
          path: release/

      - name: Set up Termux build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Termux package
        run: |
          chmod +x scripts/build-termux.sh
          scripts/build-termux.sh

      - name: Upload Termux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemapp-termux
          path: release/systemapp.deb
          compression-level: 9
          retention-days: 90
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-architectures, build-magisk, build-termux]
    # always() so an optional job being skipped (build_magisk/build_termux
    # set to "false" via workflow_dispatch) doesn't cascade into skipping
    # the release itself - only build-architectures success is required.
    if: |
      always() &&
      needs.build-architectures.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release
          # Every artifact filename already encodes its own ABI/target
          # (systemapp-<abi>, SystemApp-Magisk-<abi>.zip, systemapp.deb),
          # so flattening every file straight into release/ is enough -
          # no fragile wildcard renaming needed.
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=kVersion = ")[^"]+' include/systemapp/version.hpp)
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SystemApp ${{ steps.version.outputs.version }}
          files: |
            release/*
          body: |
            Automated build of SystemApp.

            ## Binaries
            - `systemapp-<abi>` - Standalone binary for each architecture

            ## Magisk Modules
            - `SystemApp-Magisk-<abi>.zip` - Flashable Magisk module for each architecture

            ## Termux Package
            - `systemapp.deb` - Debian package for Termux (arm64 only)

            ## Supported Architectures
            - `armeabi-v7a` (arm 32-bit)
            - `arm64-v8a` (arm 64-bit)
            - `x86` (32-bit x86, emulator)
            - `x86_64` (64-bit x86, emulator)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
